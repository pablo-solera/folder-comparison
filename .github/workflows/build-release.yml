name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Se activa cuando se crea un tag que empiece con 'v' (ej: v1.0.0)
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  build:
    runs-on: windows-latest  # Usamos Windows para generar el .exe

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install tkinterdnd2

    - name: Construir ejecutable con PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "ComparadorCarpetas" --icon=icon.ico main.py

    - name: Crear archivo ZIP
      run: |
        Compress-Archive -Path dist\ComparadorCarpetas.exe -DestinationPath ComparadorCarpetas-Windows.zip

    - name: Subir artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ComparadorCarpetas-Windows
        path: ComparadorCarpetas-Windows.zip

    - name: Crear Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ComparadorCarpetas-Windows.zip
          dist/ComparadorCarpetas.exe
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}