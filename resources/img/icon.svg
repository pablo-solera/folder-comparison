<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="folderGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="folderGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sombra suave -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="110" fill="url(#bgGradient)"/>
  
  <!-- Carpeta izquierda (base) -->
  <g filter="url(#shadow)">
    <path d="M 100 180 L 180 180 L 200 160 L 280 160 L 280 340 L 100 340 Z" 
          fill="url(#folderGradient1)" 
          stroke="#1e40af" 
          stroke-width="4"/>
    <path d="M 100 180 L 280 180 L 280 200 L 100 200 Z" 
          fill="#1e40af" 
          opacity="0.3"/>
  </g>
  
  <!-- Carpeta derecha (comparar) -->
  <g filter="url(#shadow)">
    <path d="M 232 200 L 312 200 L 332 180 L 412 180 L 412 360 L 232 360 Z" 
          fill="url(#folderGradient2)" 
          stroke="#1e40af" 
          stroke-width="3"/>
    <path d="M 232 200 L 412 200 L 412 220 L 232 220 Z" 
          fill="#1e40af" 
          opacity="0.3"/>
  </g>
  
  <!-- Flecha de comparación (doble flecha) -->
  <g fill="white" opacity="0.95">
    <!-- Flecha superior derecha -->
    <path d="M 200 240 L 280 240 L 280 225 L 310 245 L 280 265 L 280 250 L 200 250 Z"/>
    
    <!-- Flecha inferior izquierda -->
    <path d="M 312 280 L 232 280 L 232 295 L 202 275 L 232 255 L 232 270 L 312 270 Z"/>
  </g>
  
  <!-- Indicador de "nuevo" (punto decorativo) -->
  <circle cx="390" cy="200" r="18" fill="#10b981" stroke="white" stroke-width="3"/>
  <text x="390" y="208" 
        font-family="Arial, sans-serif" 
        font-size="24" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle">+</text>
</svg>
